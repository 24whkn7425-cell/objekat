<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Konobar - Objekat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #111;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .message.Vi {
            background-color: #e0e0e0;
            align-self: flex-start;
            color: #333;
        }
        .message.AI Konobar, {
            background-color: #007bff;
            align-self: flex-end;
            color: #white;
        }
        .input-container {
            display: flex;
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #ddd;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }
        #send-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 8px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>AI Konobar - Vaš digitalni poslovođa</header>

    <div id="chat-box">
        <!-- Poruke se automatski ubacuju ovde preko skripte -->
    </div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="Napišite poruku ili porudžbinu...">
        <button id="send-btn">Pošalji</button>
    </div>

    <script src="Alconobar.js"></script>
</body>
</html>
